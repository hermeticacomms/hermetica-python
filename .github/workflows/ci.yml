name: ci
on:
  push: { branches: [main] }
  pull_request:
permissions: { contents: read }
jobs:
  test:
    runs-on: ubuntu-24.04 # newer images have no Python 3.9
    strategy: { matrix: { python: ['3.9', '3.13'] } }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: '${{ matrix.python }}' }
      - run: python -m pip install build
      - run: python -m build
      - run: python -m pip install dist/*.whl && python -c "import hermetica; hermetica.Client('hm_sk_test')"
