# Push a tag matching pyproject.toml ("v0.1.0") to publish. Uses PyPI trusted publishing (configure the publisher on pypi.org:
# workflow release.yml, environment pypi); the action uploads PEP 740 attestations by default.
name: release
on:
  push: { tags: ['v*'] }
permissions: { contents: read }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: '3.13' }
      - run: test "v$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")" = "$GITHUB_REF_NAME"
      - run: python -m pip install build && python -m build
      - uses: actions/upload-artifact@v4
        with: { name: dist, path: dist/ }
  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions: { id-token: write, contents: write, attestations: write }
    steps:
      - uses: actions/download-artifact@v4
        with: { name: dist, path: dist/ }
      - uses: actions/attest-build-provenance@v3
        with: { subject-path: 'dist/*' }
      - uses: pypa/gh-action-pypi-publish@release/v1
      - run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --generate-notes
        env: { GH_TOKEN: '${{ github.token }}' }
